name: Edition health check

# Fails (and emails the repo owner via GitHub's default workflow-failure notification)
# if the 5:03 AM PT scheduled trigger and the 7:15 AM PT retry didn't land today's edition
# by 8:05 AM PT.
# Scoped narrowly: this is an alarm clock, not an executor. A second retry (jsj-edition-retry-b)
# fires at 9:30 AM PT and may still rescue the day after this check runs.

on:
  schedule:
    # 15:05 UTC = 8:05 AM PDT / 7:05 AM PST. DST drifts by one hour twice a year; acceptable.
    # Moved from 14:05 → 15:05 after cutover to Routines (2026-04-20): Routines runs
    # longer than Railway (~60–90 min vs 25 min) and was still finishing when the old
    # check fired, producing false-positive failures.
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Small history window so `git log -- content/articles/` can find the
          # most recent edition commit without fetching the entire repo.
          fetch-depth: 50

      - name: Verify today's run log exists and succeeded
        id: verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -eo pipefail
          DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          RUN="pipeline/runs/${DATE}.json"

          echo "Checking for ${RUN}"

          if [ ! -f "${RUN}" ]; then
            echo "::error title=Missing edition::No pipeline run log for ${DATE}. The 5:03 AM PT trigger and 7:15 AM PT retry both failed to land a breadcrumb."
            echo "status=missing" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          STATUS=$(jq -r '.status' "${RUN}")
          echo "Run status: ${STATUS}"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

          case "${STATUS}" in
            success)
              echo "Edition ${DATE} published successfully."
              ;;
            partial)
              ARTICLES=$(jq -r '.articles_published // (.articles | length)' "${RUN}")
              echo "::warning title=Partial edition::${DATE} published ${ARTICLES} articles (of 5 target). Not a failure, but worth a look."
              # Fall through to the alert step below — partials get the enriched message too.
              ;;
            failed|*)
              echo "::error title=Pipeline failed::${DATE} run reports status=${STATUS}. See ${RUN} for details."
              exit 1
              ;;
          esac

      - name: Verify homepage responds
        if: steps.verify.outputs.status == 'success' || steps.verify.outputs.status == 'partial'
        run: |
          set -eo pipefail
          URL="https://jamesstjournal.com"
          CODE=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 15 "${URL}")
          echo "Homepage ${URL} → HTTP ${CODE}"
          if [ "${CODE}" != "200" ]; then
            echo "::error title=Homepage down::${URL} returned ${CODE}"
            exit 1
          fi

      - name: Alert via Telegram (enriched diagnostic)
        if: failure() || steps.verify.outputs.status == 'partial'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          DATE=$(TZ=America/Los_Angeles date +%Y-%m-%d)
          RUN="pipeline/runs/${DATE}.json"
          URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Last edition commit subject + relative time (regardless of today's state)
          LAST_COMMIT=$(git log -1 --format='%s' -- content/articles/ 2>/dev/null || echo "unknown")
          LAST_COMMIT_WHEN=$(git log -1 --format='%cr' -- content/articles/ 2>/dev/null || echo "unknown")
          # Trim headline section to keep the Telegram body short
          LAST_COMMIT_SHORT=$(echo "${LAST_COMMIT}" | cut -c1-80)

          if [ ! -f "${RUN}" ]; then
            BODY="JSJ ${DATE} — NO BREADCRUMB
trigger never started, or died pre-Step-1
last edition: \"${LAST_COMMIT_SHORT}\" (${LAST_COMMIT_WHEN})
retry-b fires 9:30 PT
run: ${URL}"
          else
            STATUS=$(jq -r '.status // "unknown"' "${RUN}")
            STARTED=$(jq -r '.started_at // ""' "${RUN}")
            # Human-friendly breadcrumb age
            if [ -n "${STARTED}" ] && [ "${STARTED}" != "null" ]; then
              AGE_MIN=$(node -e "const t=new Date(process.argv[1]); console.log(isNaN(t)?'':Math.round((Date.now()-t.getTime())/60000))" "${STARTED}" 2>/dev/null || echo "")
              [ -n "${AGE_MIN}" ] && BREADCRUMB_AGE="${AGE_MIN} min ago" || BREADCRUMB_AGE="unknown"
            else
              BREADCRUMB_AGE="unknown"
            fi
            STAGE_COUNT=$(jq -r '(.stages // {}) | keys | length' "${RUN}" 2>/dev/null || echo 0)
            LAST_STAGE=$(jq -r '(.stages // {}) | keys | last // "none"' "${RUN}" 2>/dev/null || echo "none")
            SOURCES_FAILED=$(jq -r '.stages.research.sources_failed // ""' "${RUN}" 2>/dev/null || echo "")
            FIRST_ERROR=$(jq -r '.errors[0] // ""' "${RUN}" 2>/dev/null || echo "")
            # Trim error to keep body short
            FIRST_ERROR=$(echo "${FIRST_ERROR}" | cut -c1-140)

            BODY="JSJ ${DATE} — ${STATUS}
stage: ${LAST_STAGE} (${STAGE_COUNT}/9)
breadcrumb: ${BREADCRUMB_AGE}"
            [ -n "${SOURCES_FAILED}" ] && BODY="${BODY}
sources failed: ${SOURCES_FAILED}"
            [ -n "${FIRST_ERROR}" ] && BODY="${BODY}
err: ${FIRST_ERROR}"
            BODY="${BODY}
last edition: \"${LAST_COMMIT_SHORT}\" (${LAST_COMMIT_WHEN})
retry-b fires 9:30 PT
run: ${URL}"
          fi

          echo "Telegram body:"
          echo "${BODY}"

          curl -sS --max-time 10 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${BODY}" >/dev/null || true
